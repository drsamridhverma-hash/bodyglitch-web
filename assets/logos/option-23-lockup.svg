          </g>
          <text x="114" y="62" fill="#F5F5F7" font-family="'Bebas Neue', sans-serif" font-size="56" letter-spacing="3.5">BODYGLITCH</text>
          <rect x="114" y="42" width="320" height="3.5" fill="#050507"/>
