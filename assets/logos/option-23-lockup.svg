<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 115" fill="none">
          <g transform="translate(14, 14)">
            <!-- 4 Vertical Cinema Signal Bars with horizontal tracking shift -->
            <!-- Top segment -->
