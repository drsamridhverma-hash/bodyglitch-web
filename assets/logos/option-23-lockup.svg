            <rect x="26" y="8" width="12" height="26" fill="#E50914"/>
            <rect x="44" y="8" width="12" height="26" fill="#F5F5F7"/>
            <rect x="62" y="8" width="12" height="26" fill="#E50914"/>
            <!-- Middle shifted glitch segment -->
            <rect x="16" y="37" width="12" height="14" fill="#00F0FF"/>
            <rect x="34" y="37" width="12" height="14" fill="#F5F5F7"/>
            <rect x="52" y="37" width="12" height="14" fill="#E50914"/>
            <rect x="70" y="37" width="12" height="14" fill="#00F0FF"/>
            <!-- Bottom segment -->
            <rect x="8" y="54" width="12" height="26" fill="#E50914"/>
            <rect x="26" y="54" width="12" height="26" fill="#F5F5F7"/>
            <rect x="44" y="54" width="12" height="26" fill="#E50914"/>
