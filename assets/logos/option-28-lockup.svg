<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 115" fill="none">
          <!-- Solid Red Block for BODY -->
          <rect x="18" y="16" width="138" height="56" fill="#E50914"/>
          <text x="87" y="62" text-anchor="middle" fill="#FFFFFF" font-family="'Bebas Neue', sans-serif" font-size="56" letter-spacing="5">BODY</text>
          <!-- Framed Outline for GLITCH with scanline slice -->
          <rect x="156" y="16" width="204" height="56" stroke="#F5F5F7" stroke-width="3"/>
          <text x="258" y="62" text-anchor="middle" fill="#F5F5F7" font-family="'Bebas Neue', sans-serif" font-size="56" letter-spacing="5">GLITCH</text>
          <!-- Horizontal glitch slice through GLITCH box -->
          <rect x="152" y="42" width="212" height="4" fill="#050507"/>
          <rect x="164" y="43" width="190" height="2" fill="#00F0FF"/>
          <!-- Bottom STUDIO Banner -->
          <line x1="18" y1="88" x2="125" y2="88" stroke="#E50914" stroke-width="2"/>
          <text x="189" y="92" text-anchor="middle" fill="#F5F5F7" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="13" letter-spacing="12">STUDIOS</text>
          <line x1="254" y1="88" x2="360" y2="88" stroke="#E50914" stroke-width="2"/>
        </svg>
