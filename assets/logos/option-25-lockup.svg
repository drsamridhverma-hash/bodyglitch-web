<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 115" fill="none">
          <g transform="translate(14, 14)">
            <!-- 35mm Film Strip Frame -->
            <rect x="4" y="8" width="64" height="72" rx="4" fill="#0C0C12" stroke="#E50914" stroke-width="2.5"/>
            <!-- Film Sprockets Left -->
            <rect x="9" y="14" width="6" height="8" rx="1" fill="#F5F5F7"/>
            <rect x="9" y="28" width="6" height="8" rx="1" fill="#F5F5F7"/>
            <rect x="9" y="42" width="6" height="8" rx="1" fill="#F5F5F7"/>
            <rect x="9" y="56" width="6" height="8" rx="1" fill="#F5F5F7"/>
            <!-- Play Triangle inside frame -->
            <polygon points="28,28 28,60 52,44" fill="#E50914"/>
            <!-- Digital Glitch Blocks breaking out on right side -->
            <rect x="54" y="18" width="24" height="7" fill="#E50914"/>
            <rect x="62" y="30" width="22" height="6" fill="#00F0FF"/>
            <rect x="50" y="42" width="28" height="8" fill="#F5F5F7"/>
            <rect x="58" y="56" width="24" height="7" fill="#E50914"/>
          </g>
          <text x="114" y="62" fill="#F5F5F7" font-family="'Bebas Neue', sans-serif" font-size="56" letter-spacing="3.5">BODYGLITCH</text>
          <text x="116" y="86" fill="#E50914" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="11" letter-spacing="12">FILM STUDIO</text>
        </svg>
