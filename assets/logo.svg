<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 98" fill="none">
  <!-- Solid Crimson Block for BODY -->
  <rect x="6" y="6" width="138" height="56" fill="#E50914"/>
  <text x="75" y="51" text-anchor="middle" fill="#FFFFFF" font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif" font-size="52" letter-spacing="5">BODY</text>
  <!-- Stark White Framed Block for GLITCH -->
  <rect x="145.5" y="7.5" width="205" height="53" fill="#08080C" stroke="#F5F5F7" stroke-width="3"/>
  <text x="248" y="51" text-anchor="middle" fill="#F5F5F7" font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif" font-size="52" letter-spacing="5">GLITCH</text>
  <!-- Horizontal Glitch Scanline Slice through GLITCH -->
  <rect x="141" y="32" width="214" height="4.5" fill="#08080C"/>
  <rect x="152" y="33.25" width="194" height="2" fill="#00F0FF"/>
  <!-- TM Mark at Top-Right of Crest -->
  <text x="356" y="16" fill="#F5F5F7" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">TM</text>
  <!-- Bottom STUDIOS Architectural Rule & Label -->
  <line x1="6" y1="81" x2="112" y2="81" stroke="#E50914" stroke-width="2.5"/>
  <text x="182" y="85" text-anchor="middle" fill="#F5F5F7" font-family="'Inter', 'Segoe UI', Roboto, monospace" font-weight="800" font-size="12.5" letter-spacing="11">STUDIOS</text>
  <line x1="246" y1="81" x2="352" y2="81" stroke="#E50914" stroke-width="2.5"/>
</svg>
